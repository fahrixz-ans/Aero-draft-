name: Aero CD - Production Deployment & Launch Gate

on:
  push:
    branches: [ main ]

jobs:
  production-gate:
    name: Production Pre-Flight Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full QA Suite & Build Verification
        run: |
          npm run lint
          npx vitest run
          npm run build

  deploy-production:
    name: Deploy to Production
    needs: production-gate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Deploying Production Bundle to Vercel..."
          # npx vercel --prod --token $VERCEL_TOKEN

      - name: Trigger Worker Deployment & Health Check
        run: |
          echo "Verifying Health Endpoints..."
          # curl -f https://aeroapk.com/api/health
